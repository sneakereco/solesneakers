<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Your Solesneakers sign-in code</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <style>
      :root {
        color-scheme: light;
      }
      table {
        border-spacing: 0;
      }
      img {
        -ms-interpolation-mode: bicubic;
      }
      @media only screen and (max-width: 620px) {
        .email-outer {
          padding: 12px 8px !important;
        }
        .email-shell {
          border-radius: 12px !important;
        }
        .email-logo-cell {
          padding: 22px 20px 20px !important;
        }
        .email-logo {
          width: 140px !important;
        }
        .email-hero {
          padding: 32px 22px 24px !important;
        }
        .email-pad {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
        .email-heading {
          font-size: 27px !important;
        }
        .email-code {
          font-size: 30px !important;
          letter-spacing: 0.14em !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f3ef;
      color: #18181b;
      font-family:
        &quot;Helvetica Neue&quot;, &quot;Avenir Next&quot;, &quot;Segoe UI&quot;, Arial,
        Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <div
      style="
        display: none !important;
        font-size: 1px;
        line-height: 1px;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
      "
    >
      Use this code to sign in to Solesneakers.
    </div>
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      class="email-outer"
      style="width: 100%; background: #f4f3ef; padding: 32px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            class="email-shell"
            style="
              width: 100%;
              max-width: 600px;
              background: #fff;
              border: 1px solid #deddd7;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                class="email-logo-cell"
                style="
                  padding: 26px 24px 24px;
                  text-align: center;
                  background: #faf9f6;
                  border-bottom: 1px solid #deddd7;
                "
              >
                <a
                  href="{{ .SiteURL }}"
                  style="display: inline-block; text-decoration: none"
                  ><img
                    class="email-logo"
                    src="{{ .SiteURL }}/images/email-logo.png"
                    width="156"
                    alt="Solesneakers"
                    style="
                      display: block;
                      width: 156px;
                      max-width: 100%;
                      height: auto;
                      margin: 0 auto;
                      border: 0;
                    "
                /></a>
              </td>
            </tr>
            <tr>
              <td class="email-hero" style="padding: 40px 40px 26px; text-align: left">
                <div
                  style="
                    font-size: 12px;
                    line-height: 1.4;
                    letter-spacing: 0.08em;
                    color: #71717a;
                    font-weight: 600;
                  "
                >
                  Secure sign in
                </div>
                <h1
                  class="email-heading"
                  style="
                    margin: 10px 0 0;
                    font-size: 30px;
                    line-height: 1.2;
                    font-weight: 700;
                    letter-spacing: -0.025em;
                    color: #18181b;
                  "
                >
                  Your one-time access code
                </h1>
                <p
                  style="
                    margin: 14px 0 0;
                    max-width: 440px;
                    font-size: 15px;
                    line-height: 1.7;
                    color: #52525b;
                  "
                >
                  Enter this code to access your Solesneakers account.
                </p>
              </td>
            </tr>
            <tr>
              <td class="email-pad" style="padding: 0 40px 40px">
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    background: #fbfbf9;
                    border: 1px solid #e4e2dc;
                    border-radius: 12px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 20px 24px 8px;
                        font-size: 11px;
                        font-weight: 600;
                        letter-spacing: 0.06em;
                        color: #71717a;
                      "
                    >
                      Sign-in code
                    </td>
                  </tr>
                  <tr>
                    <td
                      align="center"
                      class="email-code"
                      style="
                        padding: 10px 20px 20px;
                        font-family:
                          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                        font-size: 38px;
                        line-height: 1;
                        font-weight: 700;
                        letter-spacing: 0.18em;
                        color: #18181b;
                        word-break: break-all;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 16px 24px;
                        border-top: 1px solid #e4e2dc;
                        font-size: 12px;
                        line-height: 1.6;
                        color: #71717a;
                      "
                    >
                      Expires in 1 hour. Never share this code with anyone.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                class="email-pad"
                style="
                  padding: 28px 40px;
                  background: #f1f0eb;
                  border-top: 1px solid #deddd7;
                  color: #71717a;
                  font-size: 11px;
                  line-height: 1.8;
                "
              >
                <strong
                  style="
                    display: block;
                    margin-bottom: 12px;
                    font-size: 17px;
                    color: #18181b;
                  "
                  >Solesneakers</strong
                >
                Need help?
                <a href="mailto:SolesneakersLLC@yahoo.com" style="color: #18181b"
                  >SolesneakersLLC@yahoo.com</a
                ><br />
                <a href="https://instagram.com/soles.neakers" style="color: #18181b"
                  >@soles.neakers</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

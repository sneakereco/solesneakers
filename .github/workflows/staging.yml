name: Staging CI

on:
  push:
    branches:
      - stg

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: stg

    services:
      # Local PostgreSQL for migration validation
      supabase-db:
        image: public.ecr.aws/supabase/postgres:17.6.1.043
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Vercel
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Supabase
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Shippo
      SHIPPO_API_TOKEN: ${{ secrets.SHIPPO_API_TOKEN }}
      SHIPPO_WEBHOOK_TOKEN: ${{ secrets.SHIPPO_WEBHOOK_TOKEN }}

      # Upstash Redis
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # Checkout security
      CHECKOUT_IDENTITY_HMAC_SECRET: ${{ secrets.CHECKOUT_IDENTITY_HMAC_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Square
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${{ secrets.SQUARE_WEBHOOK_NOTIFICATION_URL }}

      # Auth
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      ORDER_ACCESS_TOKEN_SECRET: ${{ secrets.ORDER_ACCESS_TOKEN_SECRET }}

      # SMTP
      SES_SMTP_HOST: ${{ secrets.SES_SMTP_HOST }}
      SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
      SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}

      # Public Config (can use variables instead of secrets)
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Local DB for validation
      LOCAL_SUPABASE_DB_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration
        shell: bash
        run: |
          [[ -n "$VERCEL_TOKEN" ]] || { echo "Missing stg environment secret: VERCEL_TOKEN"; exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]] || { echo "Missing stg environment secret: VERCEL_ORG_ID"; exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo "Missing stg environment secret: VERCEL_PROJECT_ID"; exit 1; }
          [[ -n "$CHECKOUT_IDENTITY_HMAC_SECRET" ]] || { echo "Missing stg environment secret: CHECKOUT_IDENTITY_HMAC_SECRET"; exit 1; }
          [[ -n "$CRON_SECRET" ]] || { echo "Missing stg environment secret: CRON_SECRET"; exit 1; }
          [[ -n "$SQUARE_ACCESS_TOKEN" ]] || { echo "Missing stg environment secret: SQUARE_ACCESS_TOKEN"; exit 1; }
          [[ -n "$SQUARE_LOCATION_ID" ]] || { echo "Missing stg environment secret: SQUARE_LOCATION_ID"; exit 1; }
          [[ -n "$SQUARE_WEBHOOK_SIGNATURE_KEY" ]] || { echo "Missing stg environment secret: SQUARE_WEBHOOK_SIGNATURE_KEY"; exit 1; }
          [[ -n "$SQUARE_WEBHOOK_NOTIFICATION_URL" ]] || { echo "Missing stg environment secret: SQUARE_WEBHOOK_NOTIFICATION_URL"; exit 1; }
          [[ "$SQUARE_ENVIRONMENT" == "sandbox" ]] || { echo "Staging SQUARE_ENVIRONMENT must be sandbox"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Database Migration Validation
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Validate Migrations Locally
        run: |
          # Apply migrations to local DB to verify they work
          supabase db push --db-url "$LOCAL_SUPABASE_DB_URL"
          # Lint the schema for common issues
          supabase db lint --db-url "$LOCAL_SUPABASE_DB_URL"

      # Code Quality
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The build prerenders storefront data from the staging database.
      - name: Push Migrations to Staging
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      # Seed global taxonomy reference data when rows are missing.
      - name: Seed Staging Reference Data
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -f supabase/seed.sql
          taxonomy_ready="$(psql -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -Atc "
            select exists (select 1 from public.tag_brands)
              and exists (select 1 from public.tag_models)
              and exists (select 1 from public.tag_aliases)
              and exists (select 1 from public.tag_sizes);
          ")"
          [[ "$taxonomy_ready" == "t" ]] || { echo "Seed verification failed: missing taxonomy data"; exit 1; }

      # Build (validates env vars and Next.js config)
      - name: Build
        run: npm run build

      # Deploy to Vercel
      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Environment
        run: |
          echo "Pulling Vercel environment configuration..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          echo "Environment pulled successfully"

      - name: Build Production Bundle
        run: |
          echo "Building production bundle for staging environment..."
          vercel build --prod --token=$VERCEL_TOKEN
          echo "Bundle built successfully"

      - name: Deploy to Staging
        id: deploy
        run: |
          echo "Deploying to staging..."
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"

      # Basic Health Check
      - name: Health Check
        run: |
          sleep 10  # Give deployment a moment to become available
          curl -f "https://soles-stg.vercel.app/api/healthz" || echo "Health check endpoint not found (optional)"

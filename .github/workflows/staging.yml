name: Staging Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  migrate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install migration gate dependencies
        run: npm ci --ignore-scripts

      - name: Fetch staging deployment secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Verify historical baseline and single-store preconditions
        shell: bash
        run: SINGLE_STORE_DATABASE_URL="$SUPABASE_DB_URL" node scripts/single-store/check-migration-baseline.mjs

      - name: Preview exact committed migrations with the locked CLI
        run: SINGLE_STORE_DATABASE_URL="$SUPABASE_DB_URL" node scripts/single-store/deploy-migrations.mjs preview --plan "$RUNNER_TEMP/staging-migration-plan.json"

      - name: Apply the checked plan and verify complete migration history
        run: SINGLE_STORE_DATABASE_URL="$SUPABASE_DB_URL" node scripts/single-store/deploy-migrations.mjs apply --plan "$RUNNER_TEMP/staging-migration-plan.json"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Fetch staging deployment secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Pull Vercel project configuration
        run: npx --yes vercel@59.16.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify analytics runtime and public build pairing
        run: node scripts/check-analytics-deployment.mjs staging

      - name: Build and deploy staging source
        id: deploy
        shell: bash
        run: |
          for key in NEXT_PUBLIC_POSTHOG_ENABLED NEXT_PUBLIC_MEASUREMENT_ENVIRONMENT NEXT_PUBLIC_POSTHOG_PROJECT_KEY NEXT_PUBLIC_POSTHOG_HOST; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing $key from staging Doppler config"
              exit 1
            fi
          done

          deployment_url="$(npx --yes vercel@59.16.0 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_POSTHOG_ENABLED=$NEXT_PUBLIC_POSTHOG_ENABLED" \
            --build-env "NEXT_PUBLIC_MEASUREMENT_ENVIRONMENT=$NEXT_PUBLIC_MEASUREMENT_ENVIRONMENT" \
            --build-env "NEXT_PUBLIC_POSTHOG_PROJECT_KEY=$NEXT_PUBLIC_POSTHOG_PROJECT_KEY" \
            --build-env "NEXT_PUBLIC_POSTHOG_HOST=$NEXT_PUBLIC_POSTHOG_HOST")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Fetch staging verification secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Install Vercel CLI for protected verification
        run: npm install --global vercel@59.16.0

      - name: Verify running analytics configuration and public build
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: node scripts/verify-analytics-runtime.mjs staging

      - name: Check staging readiness
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --user-agent "Solesneakers-Readiness/1.0" --fail --silent --show-error --max-time 10 "$DEPLOYMENT_URL/api/readyz"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          exit 1

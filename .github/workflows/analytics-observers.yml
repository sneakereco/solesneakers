name: Admin Analytics Observers

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event.repository.default_branch == 'main') && vars.ANALYTICS_OBSERVERS_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: analytics-observer-staging
    concurrency:
      group: analytics-observers-staging
      cancel-in-progress: false
    steps:
      - name: Checkout staging main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install observer dependencies
        run: npm ci --ignore-scripts

      - name: Fetch staging operator settings
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_ANALYTICS_TOKEN }}
          inject-env-vars: true

      - name: Run staging observation window
        run: npm run analytics:observe -- --environment staging --run

  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event.repository.default_branch == 'main') && vars.ANALYTICS_OBSERVERS_PRODUCTION_ENABLED == 'true' && vars.ANALYTICS_OBSERVERS_PRODUCTION_TAG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: analytics-observer-production
    concurrency:
      group: analytics-observers-production
      cancel-in-progress: false
    steps:
      - name: Checkout main history for tag validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Checkout the selected production release
        env:
          ANALYTICS_OBSERVERS_PRODUCTION_TAG: ${{ vars.ANALYTICS_OBSERVERS_PRODUCTION_TAG }}
        shell: bash
        run: |
          commit=$(node scripts/resolve-analytics-observer-release.mjs "$ANALYTICS_OBSERVERS_PRODUCTION_TAG")
          git checkout --detach "$commit"
          test -f scripts/run-admin-analytics-observers.mjs

      - name: Install observer dependencies
        run: npm ci --ignore-scripts

      - name: Fetch production operator settings
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_ANALYTICS_TOKEN }}
          inject-env-vars: true

      - name: Run released production observation window
        run: npm run analytics:observe -- --environment production --run

name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-key
      SUPABASE_SECRET_KEY: ci-secret-key
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      ADMIN_SESSION_SECRET: ci-admin-session-secret
      CHECKOUT_IDENTITY_HMAC_SECRET: ci-identity-hmac-secret-at-least-32-characters
      CRON_SECRET: ci-cron-secret-at-least-32-characters
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ci-analytics-token
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-key
      ORDER_ACCESS_TOKEN_SECRET: ci-order-access-token
      SES_SMTP_HOST: ci-ses-host
      SES_SMTP_PASS: ci-ses-pass
      SES_SMTP_USER: ci-ses-user
      SHIPPO_API_TOKEN: ci-shippo-api-token
      SHIPPO_WEBHOOK_TOKEN: ci-shippo-webhook-token
      SQUARE_ACCESS_TOKEN: ci-square-access-token
      SQUARE_APPLICATION_ID: ci-square-app-id
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_LOCATION_ID: ci-square-location-id
      SQUARE_WEBHOOK_NOTIFICATION_URL: https://example.invalid/api/webhooks/square
      SQUARE_WEBHOOK_SIGNATURE_KEY: ci-square-webhook-signature
      TURNSTILE_SECRET_KEY: ci-tunrstil-secret

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:jest:unit -- --runInBand

      - name: Integration tests
        run: npm run test:jest:integration -- --runInBand

      - name: Build without deployment credentials
        run: npx next build
